<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — BizCorp AI Sales Platform</title>

  <!-- Google Fonts: Playfair Display & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- AOS Animations -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card" data-aos="zoom-in" data-aos-duration="600">
    <div class="text-center mb-4">
      <a href="{{ url_for('dashboard.landing_page') }}" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-3">
        <div class="brand-icon mx-auto">
          <i class="fa-solid fa-brain"></i>
        </div>
      </a>
      <h2 class="font-heading fs-3 fw-bold text-navy" style="color: #1B264F;">Get Started Free</h2>
      <p class="text-muted small">Deploy your autonomous sales SDR in minutes</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show rounded-3 small py-2" role="alert">
            {{ message }}
            <button type="button" class="btn-close small" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('dashboard.register') }}" method="POST">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="floatingFullName" name="full_name" placeholder="Full Name" required value="{{ request.form.get('full_name', '') }}">
        <label for="floatingFullName"><i class="fa-regular fa-id-badge me-2 text-teal"></i>Full Name</label>
      </div>

      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="floatingUsername" name="username" placeholder="Username" required value="{{ request.form.get('username', '') }}">
        <label for="floatingUsername"><i class="fa-regular fa-user me-2 text-teal"></i>Username</label>
      </div>

      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="floatingEmail" name="email" placeholder="name@company.com" required value="{{ request.form.get('email', '') }}">
        <label for="floatingEmail"><i class="fa-regular fa-envelope me-2 text-teal"></i>Email address</label>
      </div>

      <div class="form-floating mb-4">
        <input type="password" class="form-control" id="floatingPassword" name="password" placeholder="Password" required minlength="6">
        <label for="floatingPassword"><i class="fa-regular fa-lock me-2 text-teal"></i>Password (min 6 characters)</label>
      </div>

      <button type="submit" class="btn btn-teal btn-pill w-100 py-3 mb-3 fs-6">
        <i class="fa-solid fa-user-plus me-1"></i> Create My Account
      </button>

      <div class="text-center text-muted small">
        Already have an account? 
        <a href="{{ url_for('dashboard.login') }}" class="text-teal fw-semibold">Sign In</a>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script>
  AOS.init({ duration: 600, once: true });
</script>
</body>
</html>
